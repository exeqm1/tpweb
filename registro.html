<body>

<div class="arriba">
<img src="/images/logo/logo2.png" alt="foto perfil">
<p style="font-size: 24px; align-items: center;font-family: oswald, bold; " >RETRO CAMISETAS</p>
  
<div class="arriba-derecha">
<a href="./index.html">Principal</a>
<a href="./productos.html">Productos</a>
</div>

</div >
<div class="relleno">
 <h1 style="color: beige;">Registrarse</h1>
 <p >
  Unite a la comunidad de <b>Retro Camisetas</b> y viví la pasión por el fútbol clásico.  
  Accedé a descuentos, lanzamientos exclusivos y mucho más.
</p>

    <form id="formu" action="procesar.php" method="post">
        <p >Datos Personales</p>
<label for="nombre">Nombre</label>
<input type="text" id="nombre" name="nombre">
<label for="apellido">Apellido</label>
<input type="text" id="apellido" name="apellido">
<label for="dni">DNI</label>
<input type="number" id="dni" name="dni">
<label for="tel">Telefono</label>
<input type="number" id="tel"  name="tel">

<p>Sobre tu cuenta</p>
<label for="email">Email</label>
<input type="email" id="email" name="email">

<label for="email2">Confirmar Email</label>
<input type="email" id="email2" name="email2">
<label for="contra">Contraseña </label>
<input type="password" id="contra" name="contra" min="8">
<label for="contra1">Confirmar Contraseña </label>
<input type="password" id="contra1" name="contra1" min="8">

<label for="xd">Acepto las Políticas de Privacidad y Términos y Condiciones</label>
<input type="checkbox" id="xd">
<input type="submit" value="Continuar" style="border: 2px; border-style: solid;" >
    </form>
    
    <footer style="margin-top: 20px;">
    © 2025 Retro Camisetas - Todos los derechos reservados
  </footer>
  </div>
  <div id="errores"></div>
  <div id="resultado" ></div>
  <script>

const formulario = document.getElementById("formu");
const errores = document.getElementById("errores");
const resultado = document.getElementById("resultado");

formulario.addEventListener("submit",function(e){
  e.preventDefault();

const resul= document.getElementById("resultado");
resul.style.backgroundColor="gray";
resul.style.display="flex";
resul.style.display="inline-block";
resul.style.justifyContent="center";
resul.style.alignItems="center";
resul.style.marginTop="40px";
resul.style.marginLeft="500px";

const nombre = document.getElementById("nombre").value.trim();


  const apellido = document.getElementById("apellido").value.trim();
  const dni = document.getElementById("dni").value.trim();
  const tel = document.getElementById("tel").value.trim();

  const email = document.getElementById("email").value.trim();
  const email2 = document.getElementById("email2").value.trim();
  const contra = document.getElementById("contra").value.trim();

  const contra1 = document.getElementById("contra1").value.trim();
  const terminos = document.getElementById("xd").checked;

const emailRegla = /\S+@\S+\.\S+/;
const telRegla = /^\d{7,15}$/;

let mensajeError=[];

if(nombre===""||apellido===""||dni===""||tel===""||email===""||email2===""||contra===""||contra1===""){
mensajeError.push("todos los campos son obligatorios");

}
if(!emailRegla.test(email)||!emailRegla.test(email2)){
mensajeError.push("ingrese el gmail de la forma correcta");

}
if(email!==email2){

mensajeError.push("los gmail no coinciden");
}
if(contra!==contra1){

mensajeError.push("las contraseñas no coinciden");
}
if(!telRegla.test(tel)){
mensajeError.push("ingrese el numero de telefono de la forma correcta");
}
if(contra.length<8||contra1.length<8){
mensajeError.push("La contraseña debe tener al menos 8 caracteres.");


}
if(!terminos){
mensajeError.push("debe aceptar los terminos")
}
if(mensajeError.length>0){
errores.style.color="red";
errores.innerHTML=mensajeError.join("<br>");


}else{

resultado.style.color = "green";
    resultado.innerHTML =
      "<h3>Datos enviados correctamente:</h3>" +
      "<ul>" +
      "<li>Nombre: " + nombre + " " + apellido + "</li>" +
      "<li>DNI: " + dni + "</li>" +
      "<li>Teléfono: " + tel + "</li>" +
      "<li>Email: " + email + "</li>" +
      "</ul>";

    formulario.reset();

}

});


  </script>
</body>
