<body>

<div class="arriba">

 <h1 style="color: beige;">Registrarse</h1>
 <p >
  Unite a la comunidad de <b>Retro Camisetas</b> y viví la pasión por el fútbol clásico.

    <form id="formu" action="procesar.php" method="post">
        <p >Datos Personales</p>
<label for="nombre">Nombre</label>
<input type="text" id="nombre" name="nombre">
<div id="errorNombre" class="error"></div>

<label for="apellido">Apellido</label>
<input type="text" id="apellido" name="apellido">
<div id="errorApellido" class="error"></div>

<label for="dni">DNI</label>
<input type="number" id="dni" name="dni">
<div id="errorDni" class="error"></div>

<label for="tel">Telefono</label>
<input type="text" id="tel"  name="tel">
<div id="errorTel" class="error"></div>

<p>Sobre tu cuenta</p>
<label for="email">Email</label>
<input type="email" id="email" name="email">
<div id="errorEmail" class="error"></div>

<label for="email2">Confirmar Email</label>
<input type="email" id="email2" name="email2">
<div id="errorEmail2" class="error"></div>

<label for="contra">Contraseña </label>
<input type="password" id="contra" name="contra" min="8">
<div id="errorContra" class="error"></div>

<label for="contra1">Confirmar Contraseña </label>
<input type="password" id="contra1" name="contra1" min="8">
<div id="errorContra2" class="error"></div>

<label for="xd">Acepto las Políticas de Privacidad y Términos y Condiciones</label>
<input type="checkbox" id="xd">
<div id="errorTerminos" class="error"></div>

<input type="submit" value="Continuar" style="border: 2px; border-style: solid;" >
    </form>

  </footer>
  </div>
  
  <div id="resultado" class="result"></div>
  <script>

const formulario = document.getElementById("formu");



formulario.addEventListener("submit",function(e){
  e.preventDefault();
let val=true;

 document.getElementById("errorNombre").textContent="";
   document.getElementById("errorApellido").textContent="";
  document.getElementById("errorDni").textContent="";
document.getElementById("errorTel").textContent="";
  document.getElementById("errorEmail").textContent="";
   document.getElementById("errorEmail2").textContent="";
   document.getElementById("errorContra").textContent="";
   document.getElementById("errorContra2").textContent="";
   document.getElementById("errorTerminos").textContent="";














const resul= document.getElementById("resultado");


const nombre = document.getElementById("nombre").value.trim();


  const apellido = document.getElementById("apellido").value.trim();
  const dni = document.getElementById("dni").value.trim();
  const tel = document.getElementById("tel").value.trim();

  const email = document.getElementById("email").value.trim();
  const email2 = document.getElementById("email2").value.trim();
  const contra = document.getElementById("contra").value.trim();

  const contra1 = document.getElementById("contra1").value.trim();
  const terminos = document.getElementById("xd").checked;

const emailRegla = /\S+@\S+\.\S+/;
const telRegla = /^\d{7,15}$/;




if(contra1===""){
document.getElementById("errorContra2").textContent="Debe ingresar una contraseña ";
val=false;
}

if(contra===""){
document.getElementById("errorContra").textContent="Debe ingresar una contraseña";
val=false;
}


if(email2===""){
document.getElementById("errorEmail2").textContent="Debe ingreasr un email";
val=false;
}else if(!emailRegla.test(email2)){

document.getElementById("errorEmail2").textContent="ingrese el gmail de la forma correcta";
val=false;
}

if(email===""){
document.getElementById("errorEmail").textContent="Debe ingresar un email";
val=false;
}else if(!emailRegla.test(email)){

document.getElementById("errorEmail").textContent="ingrese el gmail de la forma correcta";
val=false;
}

if(tel===""){

document.getElementById("errorTel").textContent="Debe ingresar un num de telefono";
val=false;
}else if(!telRegla.test(tel)){

 
 document.getElementById("errorTel").textContent="ingrese el numero de telefono de la forma correcta";
val=false;
}

if(dni===""){
document.getElementById("errorDni").textContent="Debe ingresar un DNI";
val=false;
}

if(apellido===""){
document.getElementById("errorApellido").textContent="Debe ingresar un apellido";
val=false;
}

if(nombre===""){
document.getElementById("errorNombre").textContent="Debe ingresar un nombre";
val=false;
}










if(email!==email2){
document.getElementById("errorEmail").textContent="Los campos de email no coinciden";
document.getElementById("errorEmail2").textContent="los campos de email no coinciden";
val=false;
}
if(contra!==contra1){

document.getElementById("errorContra").textContent="Los campos del password no coinciden";
document.getElementById("errorContra2").textContent="Los campos del password no coinciden";
val=false;
}
if(contra.length<8){
document.getElementById("errorContra").textContent="debe ingresar mas de 8 caracteres";
val=false;
}
if(contra1.length<8){
document.getElementById("errorContra2").textContent="debe ingresar mas de 8 caracteres";
val=false;
}

if(!terminos){
  document.getElementById("errorTerminos").textContent="Debe aceptar los terminos";
val=false;
}
if(val){
resul.textContent = "";


let titulo=document.createElement("h3");
titulo.textContent="Registro completo";
resul.appendChild(titulo);
const lista = document.createElement("ul");

  const liNombre = document.createElement("li");
  liNombre.textContent = `Nombre: ${nombre}`;
  lista.appendChild(liNombre);

  const liApellido = document.createElement("li");
  liApellido.textContent = `Apellido: ${apellido}`;
  lista.appendChild(liApellido);

  const liEmail = document.createElement("li");
  liEmail.textContent = `Email: ${email}`;
  lista.appendChild(liEmail);

  const liTel = document.createElement("li");
  liTel.textContent = `Teléfono: ${tel}`;
  lista.appendChild(liTel);

  resul.appendChild(lista);
}



});


  </script>
